name: Customer and staff browser workflows
on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: api
          persist-credentials: false
      # Public sibling repository: use the built-in read-only token by default.
      # An optional cross-repo read token supports future private visibility.
      - name: Checkout partner repository
        uses: actions/checkout@v6
        with:
          repository: uaalumni02/callbackiq_frontend
          token: ${{ secrets.CALLBACKIQ_CROSS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false
          ref: ${{ startsWith(github.head_ref, 'maintenance/paired-') && github.head_ref || vars.CALLBACKIQ_FRONTEND_REF || 'main' }}
          path: frontend
      - name: Record exact API and frontend revisions
        run: |
          mkdir -p api/browser-results
          git -C api rev-parse HEAD > api/browser-results/api-commit.txt
          git -C frontend rev-parse HEAD > api/browser-results/frontend-commit.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_BASE_URL: /api
          REACT_APP_SOCKET_URL: ""
      - run: npx playwright install --with-deps chromium
        working-directory: api
      - run: npm run test:browser
        working-directory: api
        env:
          CALLBACKIQ_FRONTEND_DIR: ${{ github.workspace }}/frontend
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-results
          path: api/browser-results
          if-no-files-found: ignore
