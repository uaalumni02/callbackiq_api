name: MeekCall paired release
on:
  push:
    branches: [main, development, "maint/**"]
    paths: [release.json]
  workflow_dispatch:
    inputs:
      confirm_deployed:
        description: Confirm the deployed pair and check its database after deployment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release manifest
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: release.json
          sparse-checkout-cone-mode: false
      - name: Read pins and require private checkout access
        id: release
        env:
          CROSS_REPO_READ: ${{ secrets.CALLBACKIQ_CROSS_REPO_READ_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_READ" ]; then
            echo "::error::Set CALLBACKIQ_CROSS_REPO_READ_TOKEN with Contents read access to callbackiq_frontend."
            exit 1
          fi
          node --input-type=commonjs -e '
            const release = require("./release.json");
            for (const name of ["apiSha", "frontendSha"]) {
              const sha = release[name];
              if (!/^[a-f0-9]{40}$/.test(sha || "")) throw Error("Invalid pinned " + name);
              console.log(name + "=" + sha);
            }
          ' >> "$GITHUB_OUTPUT"
      - name: Checkout pinned API
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.apiSha }}
          path: api
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned frontend
        uses: actions/checkout@v6
        with:
          repository: uaalumni02/callbackiq_frontend
          ref: ${{ steps.release.outputs.frontendSha }}
          token: ${{ secrets.CALLBACKIQ_CROSS_REPO_READ_TOKEN }}
          path: frontend
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: api
      - name: Verify pinned builds and browser journeys
        run: node scripts/verify-release.mjs ../frontend ../release.json
        working-directory: api
      - name: Confirm deployed versions and database rollout
        if: inputs.confirm_deployed
        env:
          MEEKCALL_RELEASE_API_URL: ${{ vars.MEEKCALL_RELEASE_API_URL }}
          MEEKCALL_RELEASE_FRONTEND_URL: ${{ vars.MEEKCALL_RELEASE_FRONTEND_URL }}
          MONGO_URL: ${{ secrets.MEEKCALL_RELEASE_MONGO_URL }}
        run: node scripts/verify-release.mjs --confirm ../release.json
        working-directory: api
      - name: Save paired release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-release-${{ github.run_id }}
          path: |
            release.json
            api/.verification
            api/browser-results
            frontend/.verification
          include-hidden-files: true
          if-no-files-found: warn
