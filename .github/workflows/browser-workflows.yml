name: Customer and staff browser workflows
on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: api
          persist-credentials: false
      # Use an explicit read-only credential for the other repository; no scoped-token fallback.
      - name: Verify cross-repository checkout credential
        env:
          MEEKCALL_CROSS_REPO_TOKEN: ${{ secrets.MEEKCALL_CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$MEEKCALL_CROSS_REPO_TOKEN" ]; then
            echo "::error::MEEKCALL_CROSS_REPO_TOKEN missing. Set a fine-grained, contents:read token with access to both MeekCall repositories."
            exit 1
          fi
      - name: Checkout partner repository
        uses: actions/checkout@v6
        with:
          repository: uaalumni02/callbackiq_frontend
          token: ${{ secrets.MEEKCALL_CROSS_REPO_TOKEN }}
          persist-credentials: false
          ref: ${{ vars.CALLBACKIQ_FRONTEND_REF || 'main' }}
          path: frontend
      - name: Record exact API and frontend revisions
        run: |
          mkdir -p api/browser-results
          git -C api rev-parse HEAD > api/browser-results/api-commit.txt
          git -C frontend rev-parse HEAD > api/browser-results/frontend-commit.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          CI: true
          REACT_APP_API_BASE_URL: /api
          REACT_APP_SOCKET_URL: ""
      - run: npx playwright install --with-deps chromium
        working-directory: api
      - run: npm run test:browser
        working-directory: api
        env:
          CALLBACKIQ_FRONTEND_DIR: ${{ github.workspace }}/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: api/browser-results
          if-no-files-found: ignore
