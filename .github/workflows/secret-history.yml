name: Secret history
on:
  push:
    branches: [main, development, "hardening/**"]
  pull_request:
    branches: [main, development, "hardening/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache: false
      - name: Install pinned history scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan all checked-out history with redacted output
        run: gitleaks detect --source . --log-opts=--all --redact
