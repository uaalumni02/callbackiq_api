name: Isolated scale regression
on:
  workflow_dispatch:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  isolated-scale:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: FIFO regression, sustained transport, isolated MongoDB and tenant tests
        run: node scripts/run-offline-scale.mjs --soak --persistence
