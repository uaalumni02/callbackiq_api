name: API CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: callbackiq-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://api.example.test
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass
      DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core CI suite
        run: npm run test:ci:core

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callbackiq-api-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  replica_set:
    name: Replica-set concurrency guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://api.example.test
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run replica-set concurrency test
        run: npm run test:replica-set
