name: API CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: callbackiq-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release certification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017/callbackiq_ci
      MONGODB_URI: mongodb://127.0.0.1:27017/callbackiq_ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://ci-api.callbackiq.com
      PUBLIC_API_URL: https://ci-api.callbackiq.com
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass
      DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify scale indexes and focused regressions
        run: npm run verify:index-manifest && npm run test:scale-readiness && npm run test:durable-persistence && npm run test:scale-release && npm run test:scale-fleet && npm run test:scale-fleet:persistence

      - name: Verify bounded owner reads and SMS tenant fairness
        run: npm run test:scale-capacity && npm run test:scale-query-fixes && npm run test:scale-query-fixes:persistence

      - name: Record certification runtime
        run: |
          mkdir -p ci-diagnostics
          node --version > ci-diagnostics/node-version.txt
          npm --version > ci-diagnostics/npm-version.txt
          git rev-parse HEAD > ci-diagnostics/api-commit.txt
      - name: Run complete deterministic release certification
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --report-on-fatalerror --report-uncaught-exception --report-directory=ci-diagnostics
        run: npm run release:certify:ci

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: callbackiq-api-coverage-${{ github.run_id }}
          path: |
            coverage/
            ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  replica_set:
    name: Replica-set concurrency guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://ci-api.callbackiq.com
      PUBLIC_API_URL: https://ci-api.callbackiq.com
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run replica-set concurrency test
        run: npm run test:replica-set
