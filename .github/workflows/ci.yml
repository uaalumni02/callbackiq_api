name: API CI

on:
  push:
    branches: [main, development, "ownership/import-proof/**"]
  pull_request:
    branches: [main, development, "ownership/**"]

permissions:
  contents: read

concurrency:
  group: callbackiq-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release certification
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      NODE_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017/callbackiq_ci
      MONGODB_URI: mongodb://127.0.0.1:27017/callbackiq_ci
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://ci-api.callbackiq.com
      PUBLIC_API_URL: https://ci-api.callbackiq.com
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BASE: ${{ github.event.before }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve changed-code comparison base
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PR_BASE" ]; then
            MEEKCALL_COMPARE_BASE="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ]; then
            MEEKCALL_COMPARE_BASE="$PUSH_BASE"
          else
            MEEKCALL_COMPARE_BASE="$(git merge-base HEAD origin/development)"
          fi
          git rev-parse --verify "${MEEKCALL_COMPARE_BASE}^{commit}"
          echo "DIFF_COVERAGE_BASE=$MEEKCALL_COMPARE_BASE" >> "$GITHUB_ENV"
      - name: Run complete authoritative release gate
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --report-on-fatalerror --report-uncaught-exception --report-directory=ci-diagnostics
        run: npm run check:release -- --output ci-diagnostics/release

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: callbackiq-api-coverage-${{ github.run_id }}
          path: |
            coverage/
            ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  replica_set:
    name: Replica-set concurrency guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: ci-placeholder-token
      TWILIO_WEBHOOK_BASE_URL: https://ci-api.callbackiq.com
      PUBLIC_API_URL: https://ci-api.callbackiq.com
      CLIENT_URL: http://localhost:3001
      A2P_EVENT_STREAM_USERNAME: ci-a2p-user
      A2P_EVENT_STREAM_PASSWORD: ci-a2p-pass

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve static and literal dynamic imports
        run: npm run audit:imports

      - name: Run replica-set concurrency test
        run: npm run test:replica-set
