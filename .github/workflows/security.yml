name: Security

on:
  pull_request:
    branches:
      - development
      - main
      - "ownership/**"
  push:
    branches:
      - development
      - main
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm

      - run: npm ci

      - name: Repository security audit
        run: node scripts/security-repository-audit.mjs

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Private repository dependency security
        if: github.event.repository.private
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changes="$(git diff --name-only "$BASE_SHA" HEAD --)"
          if printf '%s\n' "$changes" | grep -E '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|\.npmrc)$'; then
            echo "::error::Dependency changes require separate security review."
            exit 1
          fi
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: GitHub dependency review
        if: ${{ !github.event.repository.private }}
        uses: actions/dependency-review-action@v4

  external-health:
    if: github.event_name == 'schedule' && vars.CALLBACKIQ_HEALTH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Probe production liveness/readiness
        env:
          CALLBACKIQ_HEALTH_URL: ${{ vars.CALLBACKIQ_HEALTH_URL }}
        run: node scripts/security-health-probe.mjs
